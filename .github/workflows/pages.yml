name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Install
        run: uv sync --locked

      - name: Gate
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check
          uv run pytest
          uv run marimo check app.py --select MW

      - name: Export
        run: |
          uv run python -m scripts.export_site
          rm -f dist/CLAUDE.md
          test -s dist/index.html
          test "$(grep -c '<meta name="description"' dist/index.html)" = 1
          test "$(grep -c '<link rel="canonical" href="https://maehr.github.io/moritz-says/">' dist/index.html)" = 1
          test -s dist/public/embeddings.json
          test -s dist/public/fonts/ibm-plex-sans-latin-wght-normal.woff2
          test -d dist/assets

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
